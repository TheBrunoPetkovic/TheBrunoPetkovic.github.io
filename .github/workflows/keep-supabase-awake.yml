# Free Supabase projects pause after a week without "sufficient user database activity".
# This runs every day and calls keepalive(), a database function that writes one row
# (migration 20261030_008_keepalive.sql in the swaypoint repo), then checks the auth
# service. The project is on the wudygamer@gmail.com Supabase account.
#
# Until Oct 2026 it only read the trips table every two days. Row level security made that
# read return nothing, and the project got paused anyway, so it now does a real write.
# If a run fails, GitHub emails the repo owner: a failure here means the app can't sign
# anyone in, so restore the project in the Supabase dashboard right away.
#
# Remove it once the project is on Supabase Pro (Pro projects never pause).
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write to the database and check auth
        env:
          BASE: https://bnbwouyocmjgaratrdyj.supabase.co
          KEY: sb_publishable_hn4mgxZShl35k0ucOGUUsw_scbHhPI1
        run: |
          db=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 20 \
            -X POST "$BASE/rest/v1/rpc/keepalive" -H "apikey: $KEY" \
            -H "Content-Type: application/json" -d '{}')
          auth=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 20 \
            "$BASE/auth/v1/settings" -H "apikey: $KEY")
          echo "Database answered $db, auth answered $auth"
          test "$db" = "200" && test "$auth" = "200"
